<!DOCTYPE html>
<html lang="vi" data-theme="lavender">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChineseZ298 - Ôn Tập Tiếng Trung AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root[data-theme="nordic"] {
            --bg-body: #f0f6fa;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #d4e5f0;
            --text-main: #183344;
            --text-sub: #4b7188;
            --input-bg: #ffffff;
            --theme-btn-bg: #0284c7;
            --theme-btn-hover: #0369a1;
            --theme-btn-text: #ffffff;
            --accent: #0284c7;
        }
        :root[data-theme="sage"] {
            --bg-body: #f2f7f4;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #d5e5db;
            --text-main: #1e3a2b;
            --text-sub: #4f735d;
            --input-bg: #ffffff;
            --theme-btn-bg: #059669;
            --theme-btn-hover: #047857;
            --theme-btn-text: #ffffff;
            --accent: #059669;
        }
        :root[data-theme="lavender"] {
            --bg-body: #f7f5fb;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #e5def2;
            --text-main: #2d2047;
            --text-sub: #665487;
            --input-bg: #ffffff;
            --theme-btn-bg: #7c3aed;
            --theme-btn-hover: #6d28d9;
            --theme-btn-text: #ffffff;
            --accent: #7c3aed;
        }
        :root[data-theme="warm"] {
            --bg-body: #faf7f0;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #ece4d2;
            --text-main: #3d3324;
            --text-sub: #786950;
            --input-bg: #ffffff;
            --theme-btn-bg: #d97706;
            --theme-btn-hover: #b45309;
            --theme-btn-text: #ffffff;
            --accent: #d97706;
        }
        :root[data-theme="midnight"] {
            --bg-body: #0d1520;
            --bg-card: rgba(23, 34, 51, 0.95);
            --border-card: #2d3f58;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
            --input-bg: #141f2e;
            --theme-btn-bg: #f43f5e;
            --theme-btn-hover: #e11d48;
            --theme-btn-text: #ffffff;
            --accent: #f43f5e;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .theme-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
        }

        .custom-input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-theme-main {
            background-color: var(--theme-btn-bg);
            color: var(--theme-btn-text);
        }
        .btn-theme-main:hover {
            background-color: var(--theme-btn-hover);
        }

        /* Tên Ứng dụng 3D sắc nét */
        .title-3d-ruby {
            font-weight: 900;
            color: #e11d48;
            text-shadow: 
                0 1px 0 #be123c,
                0 2px 0 #9f1239,
                0 3px 0 #881337,
                0 4px 6px rgba(0,0,0,0.15);
            letter-spacing: 0.05em;
        }

        /* Xử lý 3D Flip Card chuẩn tuyệt đối, chống lỗi mirror */
        .flip-card-container {
            perspective: 1200px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card-inner.flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* Tối ưu màn hình ngang điện thoại: tự động co giãn, không cuộn */
        @media (max-height: 520px) and (orientation: landscape) {
            .landscape-compact-header { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; }
            .landscape-compact-title { font-size: 1.1rem !important; }
            .landscape-card-box { height: 210px !important; }
            .landscape-hide { display: none !important; }
            .landscape-text-sm { font-size: 0.75rem !important; }
            .landscape-h1 { font-size: 2.2rem !important; }
        }

    <script>
        // --- 1. THEME VÀ PHÁT ÂM TIẾNG TRUNG ---
        function toggleThemeMenu() {
            document.getElementById('theme-dropdown-menu').classList.toggle('hidden');
        }

        function applyTheme(themeKey, label) {
            document.documentElement.setAttribute('data-theme', themeKey);
            localStorage.setItem('chinesez_theme_pref', themeKey);
            document.getElementById('current-theme-label').innerText = label;
            document.getElementById('theme-dropdown-menu').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('chinesez_theme_pref') || 'lavender';
            const labelMap = { lavender: 'Lavender', nordic: 'Nordic', sage: 'Sage Tea', warm: 'Warm Milk', midnight: 'Midnight' };
            applyTheme(saved, labelMap[saved] || 'Lavender');
        });

        window.addEventListener('click', (e) => {
            const dropdown = document.getElementById('theme-dropdown-menu');
            if (dropdown && !e.target.closest('.relative')) {
                dropdown.classList.add('hidden');
            }
        });

        // Hàm phát âm tiếng Trung chuẩn Web Speech API
        function speakChinese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ tính năng phát âm.");
            }
        }

        // Web Audio API: Sinh âm thanh chúc mừng / báo sai
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- 2. ẨN / HIỆN MẬT KHẨU ---
        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        const initial20Lessons = [

                                <button onclick="speakChinese('${item.sentenceBefore}${item.correctAnswer}${item.sentenceAfter}')" class="text-rose-500 text-xs"><i class="fa-solid fa-volume-high"></i></button>
                            </div>
                            <p class="text-xs font-bold pt-0.5">🇨🇳 ${item.sentenceBefore}<span class="text-rose-600 underline">${item.correctAnswer}</span>${item.sentenceAfter}</p>
                            <p class="text-[11px] text-rose-600 font-semibold">🔊 ${item.pinyin}</p>
                            <p class="text-[11px] opacity-75">🇻🇳 ${item.meaning}</p>
                        </div>
                    `;
                }

                vp.innerHTML = `
                    <div class="theme-card rounded-3xl p-5 flex flex-col justify-between min-h-[260px] space-y-3">
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-600">Câu điền từ #${currentCardIndex + 1}</span>
                                <span class="text-[11px] opacity-70">Chọn từ phù hợp</span>
                            </div>
                            <div class="text-center py-4 px-2 theme-card rounded-2xl">
                                <p class="text-lg sm:text-xl font-black">${item.sentenceBefore} ${slot} ${item.sentenceAfter}</p>
                            </div>
                            <div class="flex flex-wrap justify-center gap-2">${choicesHtml || '<span class="text-xs opacity-60 italic">Đã chọn từ. Bấm vào ô để bỏ chọn.</span>'}</div>
                            ${resHtml}
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-500/20">
                            <button onclick="prevCloze()" class="px-3 py-1.5 theme-card rounded-xl text-xs font-bold cursor-pointer">Trước</button>
                            <button onclick="checkCloze()" class="px-5 py-2 btn-theme-main text-xs font-bold rounded-xl shadow cursor-pointer">Kiểm tra</button>
                            <button onclick="nextCloze()" class="px-3 py-1.5 btn-theme-main text-xs font-bold rounded-xl shadow cursor-pointer">Tiếp</button>
                        </div>
                    </div>
                `;
            } else if (currentCardMode === 'grammar') {
                const item = studyData.grammar[0];
                vp.innerHTML = `
                    <div class="theme-card rounded-3xl p-5 space-y-4 text-center">
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-600">Mẫu câu & Ngữ pháp</span>
                        <h3 class="text-lg font-bold text-rose-600">${item.pattern}</h3>
                        <p class="text-xs font-semibold opacity-80">${item.challenge}</p>
                        <div class="p-3 theme-card rounded-2xl border text-left text-xs space-y-1">
                            <p><b>Công thức:</b> ${item.formula}</p>
                            <p><b>Ví dụ:</b> 他比我高。(Tā bǐ wǒ gāo. - Anh ấy cao hơn tôi.)</p>
                        </div>
                        <button onclick="speakChinese('他比我高')" class="px-4 py-2 btn-theme-main text-xs font-bold rounded-xl shadow cursor-pointer">
                            <i class="fa-solid fa-volume-high mr-1"></i> Nghe câu mẫu
                        </button>
                    </div>
                `;
            } else if (currentCardMode === 'memory') {
                renderMemoryQuizCard(vp);
            }
        }

        // --- 7. LOGIC THẺ KIỂM TRA NHỚ TỪ MỚI ---
        function initMemoryQuiz() {
            memoryQuizBank = [...default20Vocabs];
            memoryCorrectCount = 0;
            selectedHanzi = "";
            selectedPinyin = "";
            selectedMeaning = "";
        }

        function renderMemoryQuizCard(vp) {
            if (memoryQuizBank.length === 0) {
                vp.innerHTML = `
                    <div class="theme-card rounded-3xl p-6 text-center space-y-3">
                        <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-600 flex items-center justify-center mx-auto text-xl">🎉</div>
                        <h3 class="text-xl font-black text-emerald-600">XUẤT SẮC! BẠN ĐÃ THUỘC TOÀN BỘ 20 TỪ!</h3>
                        <p class="text-xs opacity-75">Bạn đã ghép đúng tất cả các cặp Từ tiếng Trung - Pinyin - Nghĩa tiếng Việt.</p>
                        <button onclick="initMemoryQuiz(); renderStudyRoomUI()" class="px-5 py-2.5 btn-theme-main text-xs font-bold rounded-xl shadow cursor-pointer">Luyện lại từ đầu</button>
                    </div>
                `;
                return;
            }

            // Tạo danh sách trộn ngẫu nhiên cho từng ô chọn
            const hanzis = [...memoryQuizBank].sort(() => Math.random() - 0.5);
            const pinyins = [...memoryQuizBank].sort(() => Math.random() - 0.5);
            const meanings = [...memoryQuizBank].sort(() => Math.random() - 0.5);

            let hanziOptions = hanzis.map(i => `<option value="${i.hanzi}" ${selectedHanzi === i.hanzi ? 'selected' : ''}>${i.hanzi}</option>`).join('');
            let pinyinOptions = pinyins.map(i => `<option value="${i.pinyin}" ${selectedPinyin === i.pinyin ? 'selected' : ''}>${i.pinyin}</option>`).join('');
            let meaningOptions = meanings.map(i => `<option value="${i.meaning}" ${selectedMeaning === i.meaning ? 'selected' : ''}>${i.meaning}</option>`).join('');

            vp.innerHTML = `
                <div class="theme-card rounded-3xl p-4 sm:p-5 space-y-3.5">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-600">Kiểm tra nhớ từ mới</span>
                        <span class="text-xs font-bold text-emerald-600">Đã thuộc: ${memoryCorrectCount}/20</span>
                    </div>

                    <p class="text-xs font-semibold opacity-80 text-left">
                        👉 Bạn chọn từ tiếng Trung, pinyin và nghĩa tiếng Việt phù hợp:
                    </p>

                    <!-- 3 Ô Menu chọn xếp theo cột trên di động, hàng ngang trên desktop -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold opacity-70 mb-1 uppercase text-left">Từ tiếng Trung</label>
                            <select id="quiz-select-hanzi" onchange="selectedHanzi = this.value" class="w-full custom-input rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none">
                                <option value="">-- Chọn chữ Hán --</option>
                                ${hanziOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold opacity-70 mb-1 uppercase text-left">Pinyin</label>
                            <select id="quiz-select-pinyin" onchange="selectedPinyin = this.value" class="w-full custom-input rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none">
                                <option value="">-- Chọn Pinyin --</option>
                                ${pinyinOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold opacity-70 mb-1 uppercase text-left">Nghĩa tiếng Việt</label>
                            <select id="quiz-select-meaning" onchange="selectedMeaning = this.value" class="w-full custom-input rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none">
                                <option value="">-- Chọn Nghĩa --</option>
                                ${meaningOptions}
                            </select>
                        </div>
                    </div>

                    <div id="memory-feedback-msg" class="text-xs font-bold min-h-[20px]"></div>

                    <div class="flex justify-center pt-1">
                        <button onclick="checkMemoryAnswer()" class="w-full sm:w-auto px-8 py-2.5 btn-theme-main text-xs font-bold rounded-xl shadow cursor-pointer">
                            <i class="fa-solid fa-circle-check mr-1"></i> Kiểm tra đáp án
                        </button>
                    </div>
                </div>
            `;
        }

        function checkMemoryAnswer() {
            const h = document.getElementById('quiz-select-hanzi').value;
            const p = document.getElementById('quiz-select-pinyin').value;
            const m = document.getElementById('quiz-select-meaning').value;
            const msgBox = document.getElementById('memory-feedback-msg');

            if (!h || !p || !m) {
                alert("Vui lòng chọn đầy đủ cả 3 ô để kiểm tra!");
                return;
            }

            // Tìm đối tượng chuẩn
            const matched = memoryQuizBank.find(item => item.hanzi === h && item.pinyin === p && item.meaning === m);

            if (matched) {
                playTone('success');
                speakChinese(h);
                memoryCorrectCount++;
                // Xóa từ đã đúng khỏi danh sách
                memoryQuizBank = memoryQuizBank.filter(item => item.hanzi !== h);
                selectedHanzi = ""; selectedPinyin = ""; selectedMeaning = "";

                msgBox.innerHTML = `<span class="text-emerald-600 animate-pulse">🎉 Chính xác! Bạn chọn từ tiếp theo nhé!</span>`;
                setTimeout(() => {
                    renderStudyRoomUI();
                }, 1200);
            } else {
                playTone('error');
                // Tìm đáp án đúng của chữ Hán đang chọn để hiện gợi ý
                const actual = default20Vocabs.find(item => item.hanzi === h);
                let hint = actual ? `Chữ <b>${h}</b> phải đi với Pinyin: <b class="text-rose-600">${actual.pinyin}</b> và Nghĩa: <b class="text-rose-600">${actual.meaning}</b>` : "Bộ ba chưa khớp nhau, bạn hãy thử lại!";
                msgBox.innerHTML = `
                    <div class="p-2.5 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-600 text-left space-y-0.5">
                        <p class="font-bold">❌ Chưa chính xác!</p>
                        <p class="text-[11px]">${hint}</p>
                    </div>
                `;
            }
        }

        function flipCardAction(el) {
            el.querySelector('.flip-card-inner').classList.toggle('flipped');
        }

        function nextCard() { currentCardIndex = (currentCardIndex + 1) % studyData.vocab.length; renderCurrentInteractiveCard(); }
        function prevCard() { currentCardIndex = (currentCardIndex - 1 + studyData.vocab.length) % studyData.vocab.length; renderCurrentInteractiveCard(); }

        function pickCloze(w) { selectedClozeWord = w; isClozeChecked = false; renderCurrentInteractiveCard(); }
        function unpickCloze() { selectedClozeWord = null; isClozeChecked = false; renderCurrentInteractiveCard(); }
        function checkCloze() {
            if (!selectedClozeWord) { alert("Vui lòng chọn 1 từ điền vào ô trống!"); return; }
            isClozeChecked = true;
            renderCurrentInteractiveCard();
        }
        function nextCloze() { currentCardIndex = (currentCardIndex + 1) % studyData.cloze.length; selectedClozeWord = null; isClozeChecked = false; renderCurrentInteractiveCard(); }
        function prevCloze() { currentCardIndex = (currentCardIndex - 1 + studyData.cloze.length) % studyData.cloze.length; selectedClozeWord = null; isClozeChecked = false; renderCurrentInteractiveCard(); }

        // --- 8. ADMIN TẠO USER ---
        function openAdminCreateModal() { document.getElementById('admin-user-modal').classList.remove('hidden'); }
        function closeAdminCreateModal() { document.getElementById('admin-user-modal').classList.add('hidden'); }

        let lastGeneratedUserString = '';
        function executeCreateAccount() {
            const name = document.getElementById('admin-input-fullname').value.trim();
            if (!name) return;

            const words = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/\s+/);
            let initials = "";
            let lastName = words[words.length - 1];
            for (let i = 0; i < words.length - 1; i++) initials += words[i][0];
            let username = initials + lastName + Math.floor(100 + Math.random() * 900);
            let pass = "mrz" + Math.floor(1000 + Math.random() * 9000);

            registeredUsers.push({ username, pass, role: 'member', fullname: name });
            localStorage.setItem('chinesez_users', JSON.stringify(registeredUsers));

            lastGeneratedUserString = `User: ${username} | Pass: ${pass}`;
            document.getElementById('admin-account-info-text').innerText = lastGeneratedUserString;
            document.getElementById('admin-created-box').classList.remove('hidden');
        }

        function copyGeneratedUser() {
            navigator.clipboard.writeText(lastGeneratedUserString);
            alert("Đã sao chép tài khoản thành viên!");
        }
    </script>
</body>
</html>
