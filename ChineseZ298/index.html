    <style>
        /* CSS Biến màu hỗ trợ 5 Theme dịu mắt theo nghiên cứu thị giác */
        :root[data-theme="lavender"] {
            --bg-body: #f7f5fb;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #e5def2;
            --text-main: #2d2047;
            --text-sub: #665487;
            --input-bg: #ffffff;
            --btn-main: #7c3aed;
            --btn-hover: #6d28d9;
            --btn-text: #ffffff;
        }
        :root[data-theme="nordic"] {
            --bg-body: #f0f6fa;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #d4e5f0;
            --text-main: #183344;
            --text-sub: #4b7188;
            --input-bg: #ffffff;
            --btn-main: #0284c7;
            --btn-hover: #0369a1;
            --btn-text: #ffffff;
        }
        :root[data-theme="sage"] {
            --bg-body: #f2f7f4;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #d5e5db;
            --text-main: #1e3a2b;
            --text-sub: #4f735d;
            --input-bg: #ffffff;
            --btn-main: #059669;
            --btn-hover: #047857;
            --btn-text: #ffffff;
        }
        :root[data-theme="warm"] {
            --bg-body: #faf7f0;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: #ece4d2;
            --text-main: #3d3324;
            --text-sub: #786950;
            --input-bg: #ffffff;
            --btn-main: #d97706;
            --btn-hover: #b45309;
            --btn-text: #ffffff;
        }
        :root[data-theme="midnight"] {
            --bg-body: #0d1520;
            --bg-card: rgba(23, 34, 51, 0.95);
            --border-card: #2d3f58;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
            --input-bg: #141f2e;
            --btn-main: #f43f5e;
            --btn-hover: #e11d48;
            --btn-text: #ffffff;
        }

        /* KHÓA CHIỀU CAO VỪA KHÍT 100% VIEWPORT - ZERO-SCROLL */
        html, body {
            height: 100dvh;
            height: calc(var(--vh, 1vh) * 100);
            max-height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .theme-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(10px);
        }

        .custom-input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-main {
            background-color: var(--btn-main);
            color: var(--btn-text);
        }
        .btn-main:hover {
            background-color: var(--btn-hover);
        }

        .title-3d-ruby {
            font-weight: 900;
            color: #e11d48;
            text-shadow: 0 1px 0 #be123c, 0 2px 0 #9f1239, 0 3px 0 #881337, 0 4px 6px rgba(0,0,0,0.15);
            letter-spacing: 0.05em;
        }

        /* 3D FLIP CARD CHUẨN XUÔI CHIỀU (KHÔNG BỊ MIRROR) */
        .flip-card-container { perspective: 1200px; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }
        .card-back { transform: rotateY(180deg); }

        /* TỰ ĐỘNG THU PHÓNG SIÊU GỌN KHI XOAY NGANG DI ĐỘNG HOẶC MÀN HÌNH THẤP */
        @media (max-height: 520px) {
            .app-header { height: 38px !important; padding-top: 2px !important; padding-bottom: 2px !important; }
            .app-title { font-size: 1rem !important; }
            .side-bar { height: 38px !important; padding: 2px !important; }
            .card-stage { height: 180px !important; }
            .txt-hanzi { font-size: 2.2rem !important; }
            .txt-desc { display: none !important; }
        }
    </style>

        // --- A. BẢO VỆ MÃ NGUỒN (CHỐNG XEM SOURCE, CHẶN DEVTOOLS) ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || 
               (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
               (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
                e.preventDefault();
                return false;
            }
        });

        // --- B. ĐO CHIỀU CAO CHO SAFARI & CHROME DI ĐỘNG (ZERO-SCROLL) ---
        function setAppViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setAppViewportHeight);
        window.addEventListener('orientationchange', setAppViewportHeight);
        setAppViewportHeight();

        // --- C. CHỐNG CACHE: LÀM MỚI BẮT BUỘC ---
        function forceRefreshApp() {
            const now = Date.now();
            const url = new URL(window.location.href);
            url.searchParams.set('v', now);
            window.location.href = url.toString();
        }

        // --- D. WEB SPEECH API & WEB AUDIO API ---
        function speakZh(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(isWin) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            if (isWin) {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.2);
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

            document.getElementById('theme-menu').classList.add('hidden');

            if (!isAIGen && !link) { alert("Vui lòng dán link tài liệu."); return; }

            lessonsDB.unshift({ id: Date.now(), title, link: link || 'https://drive.google.com/ai-gen', date: new Date().toISOString().split('T')[0] });
            localStorage.setItem('chinesez_lessons', JSON.stringify(lessonsDB));

            alert(isAIGen ? `✨ AI đã tạo trọn bộ 20 từ vựng cho bài: ${title}` : "✨ Đã tạo bài học thành công!");

                            </div>
                            <div class="py-2.5 px-1 theme-card rounded-xl text-center">
                                <p class="text-base sm:text-lg font-black">${item.sentenceBefore} ${slot} ${item.sentenceAfter}</p>
                            </div>
                            <div class="flex flex-wrap justify-center gap-1.5">${choicesHtml || '<span class="text-[10px] opacity-60 italic">Đã chọn từ. Bấm vào ô để đổi.</span>'}</div>
                            ${resHtml}
                        </div>
                        <div class="flex justify-between items-center pt-1 border-t border-slate-500/20 shrink-0">
                            <button onclick="prevCloze()" class="px-2.5 py-1 theme-card rounded-lg text-xs font-bold cursor-pointer">Trước</button>
                            <button onclick="checkClozeAnswer()" class="px-4 py-1 btn-main text-xs font-bold rounded-lg shadow-xs cursor-pointer">Kiểm tra</button>
                            <button onclick="nextCloze()" class="px-2.5 py-1 btn-main text-xs font-bold rounded-lg shadow-xs cursor-pointer">Tiếp</button>
                        </div>
                    </div>
                `;
            } else if (currentMode === 'grammar') {
                const item = studyStore.grammar[0];
                stage.innerHTML = `
                    <div class="theme-card rounded-2xl p-4 space-y-2.5 text-center my-auto">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-600">Mẫu câu & Ngữ pháp</span>
                        <h3 class="text-base sm:text-lg font-bold text-rose-600">${item.pattern}</h3>
                        <p class="text-xs font-semibold opacity-80">${item.challenge}</p>
                        <div class="p-2.5 theme-card rounded-xl border text-left text-xs space-y-1">
                            <p><b>Công thức:</b> ${item.formula}</p>
                            <p><b>Ví dụ:</b> 他比我高。(Tā bǐ wǒ gāo. - Anh ấy cao hơn tôi.)</p>
                        </div>
                        <button onclick="speakZh('他比我高')" class="px-4 py-1.5 btn-main text-xs font-bold rounded-xl shadow-xs cursor-pointer">
                            <i class="fa-solid fa-volume-high mr-1"></i> Nghe câu mẫu
                        </button>
                    </div>
                `;
            } else if (currentMode === 'memory') {
                renderMemoryInteractiveView(stage);
            }
        }

        // --- J. THẺ KIỂM TRA NHỚ TỪ MỚI (ÂM THANH + ẨN TỪ KHI ĐÚNG) ---
        function initMemoryQuiz() {
            memoryBank = [...defaultVocabs];
            memoryScore = 0;
            selHanzi = ""; selPinyin = ""; selMeaning = "";
        }

        function renderMemoryInteractiveView(stage) {
            if (memoryBank.length === 0) {
                stage.innerHTML = `
                    <div class="theme-card rounded-2xl p-4 text-center space-y-2 my-auto">
                        <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-600 flex items-center justify-center mx-auto text-lg">🎉</div>
                        <h3 class="text-base font-black text-emerald-600">XUẤT SẮC! THUỘC TOÀN BỘ 20 TỪ!</h3>
                        <p class="text-xs opacity-75">Bạn đã ghép đúng tất cả các cặp Từ - Pinyin - Nghĩa.</p>
                        <button onclick="initMemoryQuiz(); renderStudyRoomStage()" class="px-4 py-1.5 btn-main text-xs font-bold rounded-xl shadow-xs cursor-pointer">Luyện lại</button>
                    </div>
                `;
                return;
            }

            const hanzis = [...memoryBank].sort(() => Math.random() - 0.5);
            const pinyins = [...memoryBank].sort(() => Math.random() - 0.5);
            const meanings = [...memoryBank].sort(() => Math.random() - 0.5);

            let hanziOpts = hanzis.map(i => `<option value="${i.hanzi}" ${selHanzi === i.hanzi ? 'selected' : ''}>${i.hanzi}</option>`).join('');
            let pinyinOpts = pinyins.map(i => `<option value="${i.pinyin}" ${selPinyin === i.pinyin ? 'selected' : ''}>${i.pinyin}</option>`).join('');
            let meaningOpts = meanings.map(i => `<option value="${i.meaning}" ${selMeaning === i.meaning ? 'selected' : ''}>${i.meaning}</option>`).join('');

            stage.innerHTML = `
                <div class="theme-card rounded-2xl p-3 sm:p-4 space-y-2 h-full flex flex-col justify-between">
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-600">Kiểm tra nhớ từ mới</span>
                            <span class="text-xs font-bold text-emerald-600">Đã thuộc: ${memoryScore}/20</span>
                        </div>
                        <p class="text-[11px] font-semibold opacity-80 text-left">
                            👉 Bạn chọn từ tiếng Trung, pinyin và nghĩa tiếng Việt phù hợp:
                        </p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-1.5">
                            <div>
                                <label class="block text-[9px] font-bold opacity-70 uppercase text-left">Từ tiếng Trung</label>
                                <select id="sel-hanzi" onchange="selHanzi = this.value" class="w-full custom-input rounded-lg px-2 py-1 text-xs font-bold focus:outline-none">
                                    <option value="">-- Chọn Hán tự --</option>
                                    ${hanziOpts}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold opacity-70 uppercase text-left">Pinyin</label>
                                <select id="sel-pinyin" onchange="selPinyin = this.value" class="w-full custom-input rounded-lg px-2 py-1 text-xs font-bold focus:outline-none">
                                    <option value="">-- Chọn Pinyin --</option>
                                    ${pinyinOpts}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold opacity-70 uppercase text-left">Nghĩa tiếng Việt</label>
                                <select id="sel-meaning" onchange="selMeaning = this.value" class="w-full custom-input rounded-lg px-2 py-1 text-xs font-bold focus:outline-none">
                                    <option value="">-- Chọn Nghĩa --</option>
                                    ${meaningOpts}
                                </select>
                            </div>
                        </div>
                        <div id="memory-msg" class="text-xs font-bold min-h-[16px]"></div>
                    </div>
                    <div class="flex justify-center pt-0.5 shrink-0">
                        <button onclick="checkMemory()" class="w-full sm:w-auto px-6 py-1.5 btn-main text-xs font-bold rounded-xl shadow-xs cursor-pointer">
                            <i class="fa-solid fa-circle-check mr-1"></i> Kiểm tra đáp án
                        </button>
                    </div>
                </div>
            `;
        }

        function checkMemory() {
            const h = document.getElementById('sel-hanzi').value;
            const p = document.getElementById('sel-pinyin').value;
            const m = document.getElementById('sel-meaning').value;
            const box = document.getElementById('memory-msg');

            if (!h || !p || !m) { alert("Vui lòng chọn đủ cả 3 ô!"); return; }

            const match = memoryBank.find(it => it.hanzi === h && it.pinyin === p && it.meaning === m);
            if (match) {
                playSfx(true);
                speakZh(h);
                memoryScore++;
                memoryBank = memoryBank.filter(it => it.hanzi !== h);
                selHanzi = ""; selPinyin = ""; selMeaning = "";
                box.innerHTML = `<span class="text-emerald-600 animate-pulse">🎉 Chính xác! Bạn chọn từ tiếp theo nhé!</span>`;
                setTimeout(() => renderStudyRoomStage(), 1100);
            } else {
                playSfx(false);
                const act = defaultVocabs.find(it => it.hanzi === h);
                let hint = act ? `Chữ <b>${h}</b> đi với Pinyin: <b class="text-rose-600">${act.pinyin}</b> và Nghĩa: <b class="text-rose-600">${act.meaning}</b>` : "Chưa khớp, bạn hãy thử lại!";
                box.innerHTML = `<div class="p-1.5 rounded-lg bg-rose-500/10 text-rose-600 text-[10px] text-left"><b>❌ Chưa đúng:</b> ${hint}</div>`;
            }
        }

        function flipCardInner(el) { el.querySelector('.flip-card-inner').classList.toggle('flipped'); }
        function nextItem() { currentIdx = (currentIdx + 1) % studyStore.vocab.length; renderCardInStage(); }
        function prevItem() { currentIdx = (currentIdx - 1 + studyStore.vocab.length) % studyStore.vocab.length; renderCardInStage(); }

        function pickChoice(w) { selectedWord = w; isChecked = false; renderCardInStage(); }
        function unpickChoice() { selectedWord = null; isChecked = false; renderCardInStage(); }
        function checkClozeAnswer() {
            if (!selectedWord) { alert("Vui lòng chọn 1 từ!"); return; }
            isChecked = true; renderCardInStage();
        }
        function nextCloze() { currentIdx = (currentIdx + 1) % studyStore.cloze.length; selectedWord = null; isChecked = false; renderCardInStage(); }
        function prevCloze() { currentIdx = (currentIdx - 1 + studyStore.cloze.length) % studyStore.cloze.length; selectedWord = null; isChecked = false; renderCardInStage(); }

        // --- K. ADMIN TẠO USER ---
        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

        let lastUserStr = '';
        function execCreateUser() {
            const name = document.getElementById('admin-in-name').value.trim();
            if (!name) return;

            const words = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/\s+/);
            let initials = "";
            let lastName = words[words.length - 1];
            for (let i = 0; i < words.length - 1; i++) initials += words[i][0];
            let username = initials + lastName + Math.floor(100 + Math.random() * 900);
            let pass = "mrz" + Math.floor(1000 + Math.random() * 9000);

            usersDB.push({ username, pass, role: 'member', fullname: name });
            localStorage.setItem('chinesez_users', JSON.stringify(usersDB));

            lastUserStr = `User: ${username} | Pass: ${pass}`;
            document.getElementById('admin-res-text').innerText = lastUserStr;
            document.getElementById('admin-res-box').classList.remove('hidden');
        }

        function copyUserString() {
            navigator.clipboard.writeText(lastUserStr);
            alert("Đã sao chép tài khoản thành viên!");
        }
    </script>
</body>
</html>
