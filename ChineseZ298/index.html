<!DOCTYPE html>
<html lang="vi" data-theme="nordic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChineseZ298 - Ứng Dụng Ôn Tập Tiếng Trung AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Bộ 5 Theme màu dịu mắt, chống mỏi mắt theo chuẩn thị giác */
        :root[data-theme="nordic"] {
            --bg-body: #f0f7fa;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: #d9eaf2;
            --text-main: #1e3a4c;
            --text-sub: #52798e;
            --input-bg: #ffffff;
            --accent-color: #e11d48;
            --shadow-custom: 0 10px 25px -5px rgba(30, 58, 76, 0.06);
        }
        :root[data-theme="sage"] {
            --bg-body: #f2f7f4;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: #d5e5db;
            --text-main: #234331;
            --text-sub: #537562;
            --input-bg: #ffffff;
            --accent-color: #059669;
            --shadow-custom: 0 10px 25px -5px rgba(35, 67, 49, 0.06);
        }
        :root[data-theme="lavender"] {
            --bg-body: #f6f4fa;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: #e4ddf0;
            --text-main: #33264d;
            --text-sub: #6c5a8c;
            --input-bg: #ffffff;
            --accent-color: #7c3aed;
            --shadow-custom: 0 10px 25px -5px rgba(51, 38, 77, 0.06);
        }
        :root[data-theme="warm"] {
            --bg-body: #fbf9f4;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: #ece6d8;
            --text-main: #3d352a;
            --text-sub: #786c58;
            --input-bg: #ffffff;
            --accent-color: #d97706;
            --shadow-custom: 0 10px 25px -5px rgba(61, 53, 42, 0.06);
        }
        :root[data-theme="midnight"] {
            --bg-body: #0d1520;
            --bg-card: rgba(23, 34, 51, 0.9);
            --border-card: #2d3f58;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
            --input-bg: #131d2a;
            --accent-color: #f43f5e;
            --shadow-custom: 0 12px 30px -5px rgba(0, 0, 0, 0.45);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-card {
            background-color: var(--bg-card);
            border-color: var(--border-card);
            box-shadow: var(--shadow-custom);
            backdrop-filter: blur(14px);
        }

        .custom-input {
            background-color: var(--input-bg);
            border-color: var(--border-card);
            color: var(--text-main);
        }

        /* Hiệu ứng chữ 3D nổi khối Chrome Ruby sắc nét, không bị chìm hay mờ nửa chữ */
        .title-3d-ruby {
            font-weight: 900;
            color: #e11d48;
            text-shadow: 
                0 1px 0 #be123c,
                0 2px 0 #9f1239,
                0 3px 0 #881337,
                0 4px 1px rgba(0,0,0,0.1),
                0 6px 12px rgba(190, 18, 60, 0.25);
            letter-spacing: 0.08em;
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

    <!-- THANH DROPDOWN CHỌN THEME TÙY BIẾN -->
    <div class="fixed top-3 right-3 sm:top-4 sm:right-6 z-50">

            <button onclick="toggleThemeMenu()" type="button" class="theme-card border px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl flex items-center space-x-2 text-xs font-bold shadow-md hover:scale-105 transition cursor-pointer">
                <i class="fa-solid fa-palette text-rose-500"></i>

                    <span>🌊</span> <span>Nordic Sky (Xanh da trời)</span>
                </button>
                <button onclick="applyTheme('sage', 'Sage Tea')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🍃</span> <span>Sage Tea (Xanh lá xô thơm)</span>
                </button>
                <button onclick="applyTheme('lavender', 'Lavender Mist')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🌸</span> <span>Lavender Mist (Tím êm dịu)</span>
                </button>
                <button onclick="applyTheme('warm', 'Warm Milk')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🥛</span> <span>Warm Milk (Sáng kem dịu)</span>
                </button>
                <button onclick="applyTheme('midnight', 'Midnight Slate')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🌙</span> <span>Midnight Slate (Đêm êm mắt)</span>
                </button>

        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->

            <div class="w-14 h-14 bg-gradient-to-tr from-rose-600 via-red-600 to-rose-700 rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg border border-rose-400/40 transform hover:scale-105 transition">
                中
            </div>

    <!-- MÀN HÌNH CHÍNH DASHBOARD -->

    <!-- MODAL ADMIN TẠO TÀI KHOẢN -->

    <script>
        // --- 1. THEME LOGIC ---
        function toggleThemeMenu() {
            document.getElementById('theme-dropdown-menu').classList.toggle('hidden');
        }

        function applyTheme(themeKey, label) {
            document.documentElement.setAttribute('data-theme', themeKey);
            localStorage.setItem('chinesez_theme_pref', themeKey);
            document.getElementById('current-theme-label').innerText = label;
            document.getElementById('theme-dropdown-menu').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('chinesez_theme_pref') || 'nordic';
            const labelMap = { nordic: 'Nordic Sky', sage: 'Sage Tea', lavender: 'Lavender Mist', warm: 'Warm Milk', midnight: 'Midnight Slate' };
            applyTheme(saved, labelMap[saved] || 'Nordic Sky');
        });

        window.addEventListener('click', (e) => {
            const dropdown = document.getElementById('theme-dropdown-menu');
            if (dropdown && !e.target.closest('.relative')) {
                dropdown.classList.add('hidden');
            }
        });

        // --- 2. ẨN / HIỆN MẬT KHẨU ---
        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        // --- 3. DỮ LIỆU TÀI KHOẢN & 20 BÀI HỌC CÓ SẴN ---
        let currentAuthUser = null;
        let registeredUsers = JSON.parse(localStorage.getItem('chinesez_users')) || [
            { username: 'admin298', pass: 'ADMjn298', role: 'admin', fullname: 'Quản Trị Viên' }

            { id: 4, title: 'Bài 4: Hỏi đường & Đi lại trong thành phố', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 5, title: 'Bài 5: Thủ tục sân bay & Chuyến bay', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 6, title: 'Bài 6: Đặt phòng khách sạn & Nhận phòng', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 7, title: 'Bài 7: Giao dịch ngân hàng & Đổi ngoại tệ', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 8, title: 'Bài 8: Đi khám bệnh & Mua thuốc ở hiệu thuốc', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 9, title: 'Bài 9: Giao tiếp tại công sở & Đồng nghiệp', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 10, title: 'Bài 10: Đi xem phim & Giải trí cuối tuần', link: 'https://drive.google.com/sample', date: '2026-10-31' },
            { id: 11, title: 'Bài 11: Nói chuyện thời tiết & Bốn mùa', link: 'https://drive.google.com/sample', date: '2026-10-31' },

        let lessonsList = JSON.parse(localStorage.getItem('chinesez_lessons')) || initial20Lessons;

        // Bộ từ vựng mẫu mở rộng 20 từ cho phòng học
        const extendedVocabBank = [
            { frontMain: "旅游", frontSub: "Từ vựng #1", backPinyin: "lǚ yóu", backMeaning: "Du lịch / Đi tham quan", extra: "<b>Ví dụ:</b> 我们去旅游吧。<br>(Chúng ta đi du lịch nhé.)" },

            { frontMain: "医生", frontSub: "Từ vựng #12", backPinyin: "yī shēng", backMeaning: "Bác sĩ", extra: "<b>Ví dụ:</b> 去看医生。<br>(Đi khám bác sĩ.)" },

        // Lời chúc tự động theo thời gian thực
        function getTimeBasedGreeting() {
            const h = new Date().getHours();
            if (h >= 5 && h < 11) {
                return "Chúc bạn một buổi sáng tràn đầy năng lượng và một buổi học thật hiệu quả! Bạn hãy chọn các thẻ chức năng để bắt đầu nhé!";
            } else if (h >= 11 && h < 18) {
                return "Chúc bạn một buổi chiều thật thư thái và một buổi học thật hiệu quả! Bạn hãy chọn các thẻ chức năng để bắt đầu nhé!";
            } else {
                return "Chúc bạn một buổi tối an lành và một buổi học thật hiệu quả! Bạn hãy chọn các thẻ chức năng để bắt đầu nhé!";
            }
        }

        // --- 4. ĐĂNG NHẬP / ĐĂNG XUẤT ---
        function handleLoginSubmit() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();

            const found = registeredUsers.find(acc => acc.username === u && acc.pass === p);
            if (found) {
                currentAuthUser = found;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app-screen').classList.remove('hidden');
                document.getElementById('display-user-role').innerText = `${found.fullname} (${found.role})`;
                
                if (found.role === 'admin') {
                    document.getElementById('admin-panel-btn-box').classList.remove('hidden');
                } else {
                    document.getElementById('admin-panel-btn-box').classList.add('hidden');
                }
                setDashboardTab('home');
            } else {
                alert("Tên đăng nhập hoặc mật khẩu không chính xác.");
            }
        }

        function handleLogout() {
            currentAuthUser = null;
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('main-app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">

            } else if (tabName === 'room') {
                let items = lessonsList.map(item => `

        // Tạo bài học: AI tự động sinh 20 từ vựng nếu bấm nút tạo bằng AI
        function saveLessonItem(isAIGenerateOnly) {
            const title = document.getElementById('new-lesson-title').value.trim();
            const link = document.getElementById('new-lesson-link').value.trim();
            
            if (!title) {
                alert("Vui lòng nhập tên bài học.");
                return;
            }
            if (!isAIGenerateOnly && !link) {
                alert("Vui lòng điền link tài liệu nếu tạo từ link.");
                return;
            }

            const effectiveLink = link || 'https://drive.google.com/ai-generated';
            lessonsList.unshift({ id: Date.now(), title, link: effectiveLink, date: new Date().toISOString().split('T')[0] });
            localStorage.setItem('chinesez_lessons', JSON.stringify(lessonsList));

            if (isAIGenerateOnly) {
                alert(`✨ AI đã phân tích chủ đề "${title}" và tự động khởi tạo trọn bộ 20 từ vựng, bài tập điền khuyết và ngữ pháp chuyên sâu!`);
            } else {
                alert("✨ AI đã phân tích tài liệu (Ảnh/PDF/Word) và khởi tạo bộ thẻ ôn tập!");
            }
            setDashboardTab('room');
        }

        function triggerAIChat() {
            const inp = document.getElementById('chat-msg-input');
            const box = document.getElementById('chat-stream-box');
            const val = inp.value.trim();
            if (!val) return;

            box.innerHTML += `<div class="p-2 theme-card border rounded-xl text-right"><b>Bạn:</b> ${val}</div>`;
            inp.value = '';

            setTimeout(() => {
                let zh = "我想去银行换钱。", pinyin = "Wǒ xiǎng qù yínháng huàn qián.", meaning = val;
                if(val.toLowerCase().includes("chào")) { zh = "你好！很高兴认识你。"; pinyin = "Nǐ hǎo! Hěn gāoxìng rènshí nǐ."; }
                box.innerHTML += `
                    <div class="p-2.5 bg-rose-500/10 rounded-xl border border-rose-500/20 space-y-1">
                        <p><b>🇨🇳 Tiếng Trung:</b> ${zh}</p>
                        <p class="text-rose-600"><b>🔊 Pinyin:</b> ${pinyin}</p>
                        <p class="opacity-80"><b>🇻🇳 Nghĩa:</b> ${meaning}</p>
                    </div>
                `;
                box.scrollTop = box.scrollHeight;
            }, 400);
        }

        // --- 6. PHÒNG HỌC 3 LOẠI THẺ VỚI ĐỦ 20 TỪ VỰNG ---

            currentCardMode = mode;

            ['vocab', 'cloze', 'grammar'].forEach(m => {

                    else b.className = "px-3 py-1.5 opacity-70 hover:opacity-100 rounded-xl text-xs font-bold cursor-pointer";

            renderCurrentCard();

                    </div>

                let resultReport = '';

                    let isRight = (selectedWordForCloze === item.correctAnswer);
                    let fullSentenceHtml = item.sentenceBefore + `<span class="text-rose-600 font-black underline">${item.correctAnswer}</span>` + item.sentenceAfter;
                    resultReport = `
                        <div class="mt-3 p-3.5 theme-card border ${isRight ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-rose-500/50 bg-rose-500/10'} rounded-2xl space-y-1 text-left">

                            <div class="text-sm font-bold pt-1">🇨🇳 ${fullSentenceHtml}</div>

                zone.innerHTML = `

                            ${resultReport}
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-500/20 flex justify-center">
                            <button onclick="checkClozeResult()" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow cursor-pointer">Kiểm tra đáp án</button>
                        </div>
                    </div>
                `;
            }
        }

        function flipStudyCard3D() {
            isCard3DFlipped = !isCard3DFlipped;
            const c = document.getElementById('study-card-3d');
            if (c) c.style.transform = isCard3DFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function pickClozeChoice(word) { selectedWordForCloze = word; isClozeChecked = false; renderCurrentCard(); }
        function unpickClozeChoice() { selectedWordForCloze = null; isClozeChecked = false; renderCurrentCard(); }
        function checkClozeResult() {
            if (!selectedWordForCloze) { alert("Vui lòng chọn 1 từ để điền vào ô trống trước!"); return; }
            isClozeChecked = true;
            renderCurrentCard();
        }

        function nextStudyCard() {
            const list = studyCards[currentCardMode];
            currentCardIndex = (currentCardIndex + 1) % list.length;
            selectedWordForCloze = null; isClozeChecked = false; isCard3DFlipped = false;
            renderCurrentCard();
        }
        function prevStudyCard() {
            const list = studyCards[currentCardMode];
            currentCardIndex = (currentCardIndex - 1 + list.length) % list.length;
            selectedWordForCloze = null; isClozeChecked = false; isCard3DFlipped = false;
            renderCurrentCard();
        }

        // --- 7. ADMIN TẠO TÀI KHOẢN ---
        function openAdminCreateModal() { document.getElementById('admin-user-modal').classList.remove('hidden'); }
        function closeAdminCreateModal() { document.getElementById('admin-user-modal').classList.add('hidden'); }

        let lastGeneratedUserString = '';
        function executeCreateAccount() {
            const name = document.getElementById('admin-input-fullname').value.trim();
            if (!name) return;

            const words = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/\s+/);
            let initials = "";
            let lastName = words[words.length - 1];
            for (let i = 0; i < words.length - 1; i++) initials += words[i][0];
            let username = initials + lastName + Math.floor(100 + Math.random() * 900);
            let pass = "mrz" + Math.floor(1000 + Math.random() * 9000);

            registeredUsers.push({ username, pass, role: 'member', fullname: name });
            localStorage.setItem('chinesez_users', JSON.stringify(registeredUsers));

            lastGeneratedUserString = `User: ${username} | Pass: ${pass}`;
            document.getElementById('admin-account-info-text').innerText = lastGeneratedUserString;
            document.getElementById('admin-created-box').classList.remove('hidden');
        }

        function copyGeneratedUser() {
            navigator.clipboard.writeText(lastGeneratedUserString);
            alert("Đã sao chép tài khoản thành viên!");
        }
    </script>
</body>
</html>
