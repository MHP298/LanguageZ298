<!DOCTYPE html>
<html lang="vi" data-theme="minimalist">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChineseZ298 - Ứng Dụng Ôn Tập Tiếng Trung AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root[data-theme="minimalist"] {
            --bg-body: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: rgba(226, 232, 240, 1);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --input-bg: #ffffff;
            --accent-color: #dc2626;
            --shadow-custom: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        :root[data-theme="midnight"] {
            --bg-body: #0b1120;
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-card: rgba(51, 65, 85, 0.6);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.9);
            --accent-color: #ef4444;
            --shadow-custom: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
        }
        :root[data-theme="pastel"] {
            --bg-body: #fff1f2;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: rgba(254, 205, 211, 0.8);
            --text-main: #475569;
            --text-sub: #881337;
            --input-bg: #ffffff;
            --accent-color: #f43f5e;
            --shadow-custom: 0 10px 25px -5px rgba(244, 63, 94, 0.08);
        }
        :root[data-theme="mint"] {
            --bg-body: #f0fdf4;
            --bg-card: rgba(255, 255, 255, 0.95);
            --border-card: rgba(167, 243, 208, 0.8);
            --text-main: #064e3b;
            --text-sub: #047857;
            --input-bg: #ffffff;
            --accent-color: #059669;
            --shadow-custom: 0 10px 25px -5px rgba(5, 150, 105, 0.08);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-card {
            background-color: var(--bg-card);
            border-color: var(--border-card);
            box-shadow: var(--shadow-custom);
            backdrop-filter: blur(12px);
        }

        .custom-input {
            background-color: var(--input-bg);
            border-color: var(--border-card);
            color: var(--text-main);
        }

        .metal-3d-text {
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 45%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.3)) drop-shadow(0 1px 1px rgba(255, 255, 255, 0.8));
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

    <!-- THANH DROPDOWN CHỌN THEME TÙY BIẾN GÓC PHẢI -->
    <div class="fixed top-3 right-3 sm:top-4 sm:right-6 z-50">
        <div class="relative inline-block text-left">
            <button onclick="toggleThemeMenu()" type="button" class="theme-card border px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl flex items-center space-x-2 text-xs font-bold shadow-md hover:scale-105 transition cursor-pointer">
                <i class="fa-solid fa-palette text-red-500"></i>
                <span id="current-theme-label">Minimalist</span>
                <i class="fa-solid fa-chevron-down text-[10px] ml-1 opacity-70"></i>
            </button>
            <div id="theme-dropdown-menu" class="hidden absolute right-0 mt-2 w-48 rounded-2xl bg-white border border-slate-200 shadow-2xl py-2 z-50 text-slate-800">
                <button onclick="applyTheme('minimalist', 'Minimalist')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>✨</span> <span>Minimalist (Sáng sạch)</span>
                </button>
                <button onclick="applyTheme('midnight', 'Midnight')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🌙</span> <span>Midnight (Xanh than)</span>
                </button>
                <button onclick="applyTheme('pastel', 'Pastel Sunset')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🍑</span> <span>Pastel Sunset (Hồng đào)</span>
                </button>
                <button onclick="applyTheme('mint', 'Mint & Ocean')" class="w-full text-left px-4 py-2 text-xs font-bold hover:bg-slate-100 flex items-center space-x-2">
                    <span>🌿</span> <span>Mint & Ocean (Xanh mát)</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP (KHÔNG BỊ TRÀN VIEWPORT, ĐẦY ĐỦ Ô NHẬP & ICON MẮT) -->
    <div id="auth-screen" class="min-h-screen w-full flex flex-col justify-center items-center px-4 py-8 overflow-y-auto">
        <div class="w-full max-w-sm flex flex-col items-center space-y-3.5 my-auto">
            
            <div class="w-14 h-14 bg-gradient-to-tr from-red-600 via-rose-600 to-red-800 rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg border border-red-400/40 transform hover:scale-105 transition">
                中
            </div>
            <div class="text-center">
                <h1 class="text-3xl sm:text-4xl font-black tracking-widest metal-3d-text uppercase">CHINESEZ298</h1>
                <p class="text-[11px] tracking-widest font-semibold mt-0.5 opacity-70">TRỢ LÝ AI HỌC TIẾNG TRUNG CHUYÊN NGHIỆP</p>
            </div>

            <div class="w-full theme-card border rounded-3xl p-6 sm:p-7 shadow-xl space-y-4">
                <div class="text-left">
                    <h2 class="text-lg font-bold">Đăng nhập</h2>
                    <p class="text-xs opacity-70 mt-0.5">Vui lòng nhập tài khoản để vào không gian học tập</p>
                </div>

                <div class="space-y-3.5">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider mb-1 opacity-80">Tên đăng nhập</label>
                        <input type="text" id="login-username" class="w-full custom-input border rounded-2xl px-4 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider mb-1 opacity-80">Mật khẩu</label>
                        <div class="relative">
                            <input type="password" id="login-password" class="w-full custom-input border rounded-2xl pl-4 pr-11 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-red-500 transition">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-xs opacity-60 hover:opacity-100 transition cursor-pointer">
                                <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button onclick="handleLoginSubmit()" class="w-full py-3 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-lg shadow-red-500/25 transform active:scale-95 transition cursor-pointer mt-1">
                        Đăng Nhập
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH DASHBOARD (XUẤT HIỆN SAU KHI ĐĂNG NHẬP) -->
    <div id="main-app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="theme-card border-b py-3 px-4 sm:px-6 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center font-bold text-white shadow">中</div>
                <div>
                    <h2 class="text-xl font-black metal-3d-text">CHINESEZ298</h2>
                    <p class="text-[10px] opacity-70">Không gian ôn tập cá nhân</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="display-user-role" class="text-xs px-3 py-1 rounded-xl bg-red-500/10 text-red-600 font-bold border border-red-500/20"></span>
                <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl border border-slate-500/30 text-xs font-bold hover:bg-red-500 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                </button>
            </div>
        </header>

        <!-- Thân trang chia tỷ lệ 1/5 và 4/5 -->
        <div class="flex-grow flex flex-col md:flex-row max-w-7xl w-full mx-auto p-4 gap-4">
            <!-- Sidebar -->
            <aside class="w-full md:w-1/5 theme-card border rounded-3xl p-4 flex flex-col justify-between shadow-lg">
                <div class="space-y-2">
                    <div class="text-[11px] font-black opacity-50 uppercase tracking-widest px-2 mb-2">Chức năng</div>
                    <button onclick="setDashboardTab('home')" id="tab-btn-home" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs bg-red-600 text-white shadow flex items-center space-x-2 transition cursor-pointer">
                        <i class="fa-solid fa-house w-4"></i> <span>Trang chủ</span>
                    </button>
                    <button onclick="setDashboardTab('create')" id="tab-btn-create" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs opacity-75 hover:opacity-100 flex items-center space-x-2 transition cursor-pointer">
                        <i class="fa-solid fa-file-circle-plus w-4"></i> <span>Tạo bài học mới</span>
                    </button>
                    <button onclick="setDashboardTab('room')" id="tab-btn-room" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs opacity-75 hover:opacity-100 flex items-center space-x-2 transition cursor-pointer">
                        <i class="fa-solid fa-graduation-cap w-4"></i> <span>Phòng học</span>
                    </button>
                    <button onclick="setDashboardTab('chat')" id="tab-btn-chat" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs opacity-75 hover:opacity-100 flex items-center space-x-2 transition cursor-pointer">
                        <i class="fa-solid fa-comments w-4"></i> <span>Chat AI Dịch</span>
                    </button>
                </div>

                <div id="admin-panel-btn-box" class="hidden pt-4 border-t border-slate-500/20">
                    <button onclick="openAdminCreateModal()" class="w-full px-4 py-3 rounded-2xl font-bold text-xs bg-amber-600 text-white shadow hover:bg-amber-700 transition flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-user-plus w-4"></i> <span>Tạo tài khoản</span>
                    </button>
                </div>
            </aside>

            <!-- Vùng nội dung 4/5 -->
            <main id="dashboard-content" class="w-full md:w-4/5 theme-card border rounded-3xl p-6 shadow-lg flex flex-col justify-center items-center text-center">
            </main>
        </div>
    </div>

    <!-- MODAL ADMIN TẠO TÀI KHOẢN -->
    <div id="admin-user-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="theme-card border rounded-3xl p-6 max-w-sm w-full space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm">Tạo tài khoản thành viên</h3>
                <button onclick="closeAdminCreateModal()" class="text-sm opacity-60 hover:opacity-100 cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 opacity-75 uppercase">Họ và tên</label>
                <input type="text" id="admin-input-fullname" class="w-full custom-input border rounded-xl px-3 py-2 text-xs focus:outline-none">
            </div>
            <button onclick="executeCreateAccount()" class="w-full py-2.5 bg-amber-600 text-white font-bold text-xs rounded-xl shadow cursor-pointer">Tạo tự động</button>
            <div id="admin-created-box" class="hidden p-3 bg-black/10 rounded-xl text-left text-xs font-mono space-y-2">
                <p id="admin-account-info-text"></p>
                <button onclick="copyGeneratedUser()" class="text-[11px] text-amber-600 font-bold underline cursor-pointer">Sao chép</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. THEME LOGIC ---
        function toggleThemeMenu() {
            document.getElementById('theme-dropdown-menu').classList.toggle('hidden');
        }

        function applyTheme(themeKey, label) {
            document.documentElement.setAttribute('data-theme', themeKey);
            localStorage.setItem('chinesez_theme_pref', themeKey);
            document.getElementById('current-theme-label').innerText = label;
            document.getElementById('theme-dropdown-menu').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('chinesez_theme_pref') || 'minimalist';
            applyTheme(saved, saved === 'midnight' ? 'Midnight' : (saved === 'pastel' ? 'Pastel Sunset' : (saved === 'mint' ? 'Mint & Ocean' : 'Minimalist')));
        });

        window.addEventListener('click', (e) => {
            const dropdown = document.getElementById('theme-dropdown-menu');
            if (dropdown && !e.target.closest('.relative')) {
                dropdown.classList.add('hidden');
            }
        });

        // --- 2. ẨN / HIỆN MẬT KHẨU ---
        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        // --- 3. DỮ LIỆU TÀI KHOẢN & BÀI HỌC ---
        let currentAuthUser = null;
        let registeredUsers = JSON.parse(localStorage.getItem('chinesez_users')) || [
            { username: 'admin298', pass: 'ADMjn298', role: 'admin', fullname: 'Quản Trị Viên' }
        ];

        let lessonsList = JSON.parse(localStorage.getItem('chinesez_lessons')) || [
            { id: 1, title: 'Bài 1: Giao tiếp & Mua sắm', link: 'https://drive.google.com/sample', date: '2026-10-31' }
        ];

        // Dữ liệu mẫu 3 loại thẻ học
        const studyCards = {
            vocab: [
                { badge: "THẺ TỪ VỰNG 1/3", frontMain: "旅游", frontSub: "Từ vựng cốt lõi tài liệu", backPinyin: "lǚ yóu", backMeaning: "Du lịch / Đi tham quan", extra: "<b>Ví dụ:</b> 我们根本没时间旅游。<br><span style='font-size:12px; opacity:0.7;'>Wǒmen gēnběn méi shíjiān lǚyóu. (Chúng tôi vốn không có thời gian du lịch.)</span>" },
                { badge: "THẺ TỪ VỰNG 2/3", frontMain: "咖啡", frontSub: "Từ vựng cốt lõi tài liệu", backPinyin: "kā fēi", backMeaning: "Cà phê", extra: "<b>Ví dụ:</b> 你想喝杯咖啡吗？<br><span style='font-size:12px; opacity:0.7;'>Nǐ xiǎng hē bēi kāfēi ma? (Bạn có muốn uống một cốc cà phê không?)</span>" },
                { badge: "THẺ TỪ VỰNG 3/3", frontMain: "航班", frontSub: "Từ vựng cốt lõi tài liệu", backPinyin: "háng bān", backMeaning: "Chuyến bay", extra: "<b>Ví dụ:</b> 飞机航班延误了。<br><span style='font-size:12px; opacity:0.7;'>Fēijī hángbān yánwù le. (Chuyến bay của máy bay bị hoãn rồi.)</span>" }
            ],
            cloze: [
                { badge: "THẺ ĐIỀN CHỖ TRỐNG 1/3", sentenceBefore: "我明天要去 ", sentenceAfter: " 。", correctAnswer: "旅游", choices: ["咖啡", "旅游", "机场", "手机"], pinyin: "Wǒ míngtiān yào qù lǚyóu.", meaning: "Ngày mai tôi chuẩn bị đi du lịch." },
                { badge: "THẺ ĐIỀN CHỖ TRỐNG 2/3", sentenceBefore: "桌子上有一杯 ", sentenceAfter: " 。", correctAnswer: "咖啡", choices: ["报纸", "咖啡", "房间", "牛奶"], pinyin: "Zhuōzi shàng yǒu yì bēi kāfēi.", meaning: "Trên bàn có một cốc cà phê." },
                { badge: "THẺ ĐIỀN CHỖ TRỐNG 3/3", sentenceBefore: "这个 ", sentenceAfter: " 的票已经卖完了。", correctAnswer: "航班", choices: ["宾馆", "航班", "电脑", "教师"], pinyin: "Zhège hángbān de piào yǐjīng mài wán le.", meaning: "Vé của chuyến bay này đã bán hết rồi." }
            ],
            grammar: [
                { badge: "THẺ NGỮ PHÁP 1/3", frontMain: "Cấu trúc so sánh hơn với <span style='color:#dc2626;'>比 (bǐ)</span><br><div style='font-size:14px; font-weight:normal; margin-top:8px; opacity:0.7;'>Sắp xếp: 他 / 我 / 高 / 比</div>", frontSub: "Thử thách cấu trúc câu", backPinyin: "Tā bǐ wǒ gāo.", backMeaning: "Anh ấy cao hơn tôi.", extra: "<b>Công thức:</b> [A] + 比 (bǐ) + [B] + [Tính từ]<br><b>Lưu ý:</b> Không dùng '很' trước tính từ trong câu so sánh 比." }
            ]
        };

        // --- 4. ĐĂNG NHẬP / ĐĂNG XUẤT ---
        function handleLoginSubmit() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();

            const found = registeredUsers.find(acc => acc.username === u && acc.pass === p);
            if (found) {
                currentAuthUser = found;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app-screen').classList.remove('hidden');
                document.getElementById('display-user-role').innerText = `${found.fullname} (${found.role})`;
                
                if (found.role === 'admin') {
                    document.getElementById('admin-panel-btn-box').classList.remove('hidden');
                } else {
                    document.getElementById('admin-panel-btn-box').classList.add('hidden');
                }
                setDashboardTab('home');
            } else {
                alert("Tên đăng nhập hoặc mật khẩu không chính xác.");
            }
        }

        function handleLogout() {
            currentAuthUser = null;
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('main-app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        // --- 5. ĐIỀU HƯỚNG TABS & BỘ THẺ HỌC ---
        function setDashboardTab(tabName) {
            ['home', 'create', 'room', 'chat'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (btn) {
                    if (t === tabName) {
                        btn.className = "w-full text-left px-4 py-3 rounded-2xl font-bold text-xs bg-red-600 text-white shadow flex items-center space-x-2 transition cursor-pointer";
                    } else {
                        btn.className = "w-full text-left px-4 py-3 rounded-2xl font-bold text-xs opacity-75 hover:opacity-100 flex items-center space-x-2 transition cursor-pointer";
                    }
                }
            });

            const content = document.getElementById('dashboard-content');
            if (tabName === 'home') {
                content.innerHTML = `
                    <div class="space-y-4 max-w-md my-auto">
                        <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-3xl flex items-center justify-center mx-auto text-2xl font-bold border border-red-500/20 shadow-sm">中</div>
                        <h3 class="text-2xl font-black metal-3d-text">CHÀO MỪNG BẠN</h3>
                        <p class="text-xs opacity-70 leading-relaxed">Hệ thống hỗ trợ tự ôn tập tiếng Trung thông minh với AI. Bạn có thể tải tài liệu (Ảnh, PDF, Word) qua link để AI trích xuất thẻ học, hoặc sử dụng Khung Chat AI Dịch Thuật.</p>
                        <button onclick="setDashboardTab('create')" class="px-5 py-2.5 bg-red-600 text-white font-bold text-xs rounded-xl shadow hover:bg-red-700 transition cursor-pointer">Tạo bài học mới</button>
                    </div>
                `;
            } else if (tabName === 'create') {
                content.innerHTML = `
                    <div class="w-full max-w-lg space-y-4 text-left my-auto">
                        <h3 class="text-lg font-bold">Tạo bài học mới từ tài liệu</h3>
                        <div>
                            <label class="block text-xs font-bold mb-1 opacity-75 uppercase">Tên bài học</label>
                            <input type="text" id="new-lesson-title" placeholder="Ví dụ: Bài 4: Giao tiếp sân bay" class="w-full custom-input border rounded-2xl px-4 py-2.5 text-xs focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1 opacity-75 uppercase">Link tài liệu (Ảnh, PDF, Word Google Drive)</label>
                            <input type="text" id="new-lesson-link" placeholder="Dán link Drive chia sẻ công khai hoặc URL tệp..." class="w-full custom-input border rounded-2xl px-4 py-2.5 text-xs focus:outline-none">
                        </div>
                        <button onclick="saveLessonItem()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-2xl shadow transition cursor-pointer">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI Phân Tích & Tạo Thẻ Ôn Tập
                        </button>
                    </div>
                `;
            } else if (tabName === 'room') {
                let items = lessonsList.map(item => `
                    <div class="p-3.5 theme-card border rounded-2xl flex justify-between items-center text-left">
                        <div>
                            <p class="text-xs font-bold">${item.title}</p>
                            <p class="text-[10px] opacity-60">Ngày tạo: ${item.date} | <a href="${item.link}" target="_blank" class="text-red-500 underline">Tài liệu</a></p>
                        </div>
                        <button onclick="enterStudyRoom('${item.id}')" class="px-4 py-2 bg-red-600 text-white text-xs font-bold rounded-xl shadow hover:bg-red-700 cursor-pointer">Vào học</button>
                    </div>
                `).join('');

                content.innerHTML = `
                    <div class="w-full max-w-lg space-y-3.5 text-left my-auto">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold">Phòng học (Danh sách bài)</h3>
                            <button onclick="setDashboardTab('create')" class="text-xs text-red-500 font-bold underline cursor-pointer">+ Thêm bài</button>
                        </div>
                        <div class="space-y-2.5 max-h-80 overflow-y-auto pr-1">${items}</div>
                    </div>
                `;
            } else if (tabName === 'chat') {
                content.innerHTML = `
                    <div class="w-full max-w-lg space-y-3 text-left my-auto">
                        <h3 class="text-lg font-bold">Khung Chat AI Dịch Thuật</h3>
                        <div id="chat-stream-box" class="theme-card border rounded-2xl p-3.5 h-64 overflow-y-auto space-y-2 text-xs">
                            <div class="p-2.5 bg-red-500/10 rounded-xl border border-red-500/20">
                                <b>🤖 AI:</b> Nhập bất kỳ câu tiếng Việt nào, tôi sẽ dịch sang tiếng Trung kèm Pinyin chuẩn xác.
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="chat-msg-input" placeholder="Ví dụ: Hôm nay tôi muốn đi đổi tiền..." class="flex-grow custom-input border rounded-xl px-3 py-2 text-xs focus:outline-none">
                            <button onclick="triggerAIChat()" class="px-4 py-2 bg-red-600 text-white text-xs font-bold rounded-xl shadow hover:bg-red-700 cursor-pointer">Gửi</button>
                        </div>
                    </div>
                `;
            }
        }

        function saveLessonItem() {
            const title = document.getElementById('new-lesson-title').value.trim();
            const link = document.getElementById('new-lesson-link').value.trim();
            if (!title || !link) {
                alert("Vui lòng điền đầy đủ tên bài học và link tài liệu.");
                return;
            }
            lessonsList.unshift({ id: Date.now(), title, link, date: new Date().toISOString().split('T')[0] });
            localStorage.setItem('chinesez_lessons', JSON.stringify(lessonsList));
            alert("✨ AI đã phân tích tài liệu và khởi tạo bộ thẻ ôn tập!");
            setDashboardTab('room');
        }

        function triggerAIChat() {
            const inp = document.getElementById('chat-msg-input');
            const box = document.getElementById('chat-stream-box');
            const val = inp.value.trim();
            if (!val) return;

            box.innerHTML += `<div class="p-2 theme-card border rounded-xl text-right"><b>Bạn:</b> ${val}</div>`;
            inp.value = '';

            setTimeout(() => {
                let zh = "我想去银行换钱。", pinyin = "Wǒ xiǎng qù yínháng huàn qián.", meaning = val;
                if(val.toLowerCase().includes("chào")) { zh = "你好！很高兴认识你。"; pinyin = "Nǐ hǎo! Hěn gāoxìng rènshí nǐ."; }
                box.innerHTML += `
                    <div class="p-2.5 bg-red-500/10 rounded-xl border border-red-500/20 space-y-1">
                        <p><b>🇨🇳 Tiếng Trung:</b> ${zh}</p>
                        <p class="text-red-500"><b>🔊 Pinyin:</b> ${pinyin}</p>
                        <p class="opacity-80"><b>🇻🇳 Nghĩa:</b> ${meaning}</p>
                    </div>
                `;
                box.scrollTop = box.scrollHeight;
            }, 400);
        }

        // --- 6. PHÒNG VÀO HỌC VỚI 3 DẠNG THẺ TƯƠNG TÁC ---
        let currentCardMode = 'vocab';
        let currentCardIndex = 0;
        let selectedWordForCloze = null;
        let isClozeChecked = false;
        let isCard3DFlipped = false;

        function enterStudyRoom(lessonId) {
            // Tự động xoay ngang nếu là thiết bị di động
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            const content = document.getElementById('dashboard-content');
            content.innerHTML = `
                <div class="w-full max-w-lg space-y-4 text-left my-auto">
                    <div class="flex justify-between items-center theme-card border p-2.5 rounded-2xl">
                        <div class="flex space-x-1.5">
                            <button onclick="switchCardMode('vocab')" id="btn-mode-vocab" class="px-3 py-1.5 bg-red-600 text-white rounded-xl text-xs font-bold cursor-pointer">1. Từ vựng</button>
                            <button onclick="switchCardMode('cloze')" id="btn-mode-cloze" class="px-3 py-1.5 opacity-70 hover:opacity-100 rounded-xl text-xs font-bold cursor-pointer">2. Điền ô trống</button>
                            <button onclick="switchCardMode('grammar')" id="btn-mode-grammar" class="px-3 py-1.5 opacity-70 hover:opacity-100 rounded-xl text-xs font-bold cursor-pointer">3. Ngữ pháp</button>
                        </div>
                        <button onclick="setDashboardTab('room')" class="text-xs opacity-70 hover:opacity-100 font-bold px-2 cursor-pointer">Thoát</button>
                    </div>

                    <div id="flashcard-render-zone"></div>

                    <div class="flex justify-between items-center pt-2">
                        <button onclick="prevStudyCard()" class="px-4 py-2 theme-card border rounded-xl text-xs font-bold cursor-pointer">Trước</button>
                        <span class="text-xs font-bold opacity-60">Thẻ <span id="card-num-text" class="text-red-500 font-bold">1</span> / 3</span>
                        <button onclick="nextStudyCard()" class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-bold shadow hover:bg-red-700 cursor-pointer">Tiếp theo</button>
                    </div>
                </div>
            `;
            renderCurrentCard();
        }

        function switchCardMode(mode) {
            currentCardMode = mode;
            currentCardIndex = 0;
            selectedWordForCloze = null;
            isClozeChecked = false;
            isCard3DFlipped = false;

            ['vocab', 'cloze', 'grammar'].forEach(m => {
                const b = document.getElementById(`btn-mode-${m}`);
                if (b) {
                    if (m === mode) b.className = "px-3 py-1.5 bg-red-600 text-white rounded-xl text-xs font-bold cursor-pointer";
                    else b.className = "px-3 py-1.5 opacity-70 hover:opacity-100 rounded-xl text-xs font-bold cursor-pointer";
                }
            });
            renderCurrentCard();
        }

        function renderCurrentCard() {
            const list = studyCards[currentCardMode];
            const item = list[currentCardIndex];
            const zone = document.getElementById('flashcard-render-zone');
            document.getElementById('card-num-text').innerText = currentCardIndex + 1;

            if (currentCardMode === 'vocab' || currentCardMode === 'grammar') {
                zone.innerHTML = `
                    <div class="perspective-1000 w-full h-[320px] cursor-pointer" onclick="flipStudyCard3D()">
                        <div id="study-card-3d" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-3xl border theme-card">
                            <div class="absolute inset-0 w-full h-full backface-hidden flex flex-col justify-between p-7 rounded-3xl">
                                <div class="flex justify-between items-center">
                                    <span class="px-2.5 py-1 bg-red-500/10 text-red-500 text-[11px] font-extrabold rounded-full border border-red-500/20">${item.badge}</span>
                                    <span class="text-[11px] opacity-60"><i class="fa-solid fa-rotate mr-1"></i> Click lật mặt sau</span>
                                </div>
                                <div class="text-center my-auto">
                                    <h3 class="text-5xl font-black tracking-wide">${item.frontMain}</h3>
                                    <p class="text-xs opacity-70 mt-2">${item.frontSub}</p>
                                </div>
                                <div class="text-center text-[11px] text-red-500 bg-red-500/10 py-1.5 rounded-xl border border-red-500/20 font-semibold">Ghi nhớ ý nghĩa trước khi lật</div>
                            </div>
                            <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 flex flex-col justify-between p-7 theme-card rounded-3xl border">
                                <div class="flex justify-between items-center">
                                    <span class="px-2.5 py-1 bg-red-600 text-white text-[11px] font-extrabold rounded-full">ĐÁP ÁN & PHIÊN ÂM</span>
                                </div>
                                <div class="text-center my-auto space-y-1.5">
                                    <h3 class="text-2xl font-black text-red-500">${item.backPinyin}</h3>
                                    <p class="text-lg font-bold">${item.backMeaning}</p>
                                    <div class="text-xs opacity-85 theme-card border p-2.5 rounded-xl text-left">${item.extra}</div>
                                </div>
                                <div class="text-center text-[10px] opacity-60">Đã ôn tập xong</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Thẻ điền ô trống tương tác
                let choicesHtml = item.choices.map(word => {
                    if (word === selectedWordForCloze) return '';
                    return `<button onclick="pickClozeChoice('${word}')" class="px-3.5 py-2 theme-card border hover:border-red-500 font-bold text-xs rounded-xl shadow-sm transition cursor-pointer">${word}</button>`;
                }).join('');

                let blankSlot = selectedWordForCloze
                    ? `<span onclick="unpickClozeChoice()" class="text-red-600 font-black border-b-2 border-red-500 px-2 cursor-pointer bg-red-500/10 rounded" title="Click để hủy chọn">${selectedWordForCloze} ✕</span>`
                    : `<span class="inline-block w-14 border-b-2 border-dashed opacity-50 mx-1 text-center">( ? )</span>`;

                let resultReport = '';
                if (isClozeChecked) {
                    let isRight = (selectedWordForCloze === item.correctAnswer);
                    let fullSentenceHtml = item.sentenceBefore + `<span class="text-red-600 font-black underline">${item.correctAnswer}</span>` + item.sentenceAfter;
                    resultReport = `
                        <div class="mt-3 p-3.5 theme-card border ${isRight ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-rose-500/50 bg-rose-500/10'} rounded-2xl space-y-1 text-left">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isRight ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">${isRight ? '✓ Chính xác' : '✗ Chưa chính xác'}</span>
                            <div class="text-sm font-bold pt-1">🇨🇳 ${fullSentenceHtml}</div>
                            <div class="text-xs font-semibold text-red-500">🔊 ${item.pinyin}</div>
                            <div class="text-xs font-medium opacity-80">🇻🇳 ${item.meaning}</div>
                        </div>
                    `;
                }

                zone.innerHTML = `
                    <div class="theme-card rounded-3xl p-5 sm:p-6 border flex flex-col justify-between min-h-[320px]">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="px-2.5 py-1 bg-red-500/10 text-red-500 text-[11px] font-extrabold rounded-full border border-red-500/20">${item.badge}</span>
                                <span class="text-[11px] opacity-70">Chọn từ thích hợp điền vào ô trống</span>
                            </div>
                            <div class="text-center my-4 py-3 theme-card border rounded-2xl px-3">
                                <div class="text-xl sm:text-2xl font-black">${item.sentenceBefore} ${blankSlot} ${item.sentenceAfter}</div>
                            </div>
                            <div class="text-center mb-2">
                                <div class="flex flex-wrap justify-center gap-2">${choicesHtml || '<span class="text-xs opacity-60 italic">Đã chọn từ. Bấm vào ô trống để bỏ chọn.</span>'}</div>
                            </div>
                            ${resultReport}
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-500/20 flex justify-center">
                            <button onclick="checkClozeResult()" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow cursor-pointer">Kiểm tra đáp án</button>
                        </div>
                    </div>
                `;
            }
        }

        function flipStudyCard3D() {
            isCard3DFlipped = !isCard3DFlipped;
            const c = document.getElementById('study-card-3d');
            if (c) c.style.transform = isCard3DFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function pickClozeChoice(word) { selectedWordForCloze = word; isClozeChecked = false; renderCurrentCard(); }
        function unpickClozeChoice() { selectedWordForCloze = null; isClozeChecked = false; renderCurrentCard(); }
        function checkClozeResult() {
            if (!selectedWordForCloze) { alert("Vui lòng chọn 1 từ để điền vào ô trống trước!"); return; }
            isClozeChecked = true;
            renderCurrentCard();
        }

        function nextStudyCard() {
            const list = studyCards[currentCardMode];
            currentCardIndex = (currentCardIndex + 1) % list.length;
            selectedWordForCloze = null; isClozeChecked = false; isCard3DFlipped = false;
            renderCurrentCard();
        }
        function prevStudyCard() {
            const list = studyCards[currentCardMode];
            currentCardIndex = (currentCardIndex - 1 + list.length) % list.length;
            selectedWordForCloze = null; isClozeChecked = false; isCard3DFlipped = false;
            renderCurrentCard();
        }

        // --- 7. ADMIN TẠO TÀI KHOẢN ---
        function openAdminCreateModal() { document.getElementById('admin-user-modal').classList.remove('hidden'); }
        function closeAdminCreateModal() { document.getElementById('admin-user-modal').classList.add('hidden'); }

        let lastGeneratedUserString = '';
        function executeCreateAccount() {
            const name = document.getElementById('admin-input-fullname').value.trim();
            if (!name) return;

            const words = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(/\s+/);
            let initials = "";
            let lastName = words[words.length - 1];
            for (let i = 0; i < words.length - 1; i++) initials += words[i][0];
            let username = initials + lastName + Math.floor(100 + Math.random() * 900);
            let pass = "mrz" + Math.floor(1000 + Math.random() * 9000);

            registeredUsers.push({ username, pass, role: 'member', fullname: name });
            localStorage.setItem('chinesez_users', JSON.stringify(registeredUsers));

            lastGeneratedUserString = `User: ${username} | Pass: ${pass}`;
            document.getElementById('admin-account-info-text').innerText = lastGeneratedUserString;
            document.getElementById('admin-created-box').classList.remove('hidden');
        }

        function copyGeneratedUser() {
            navigator.clipboard.writeText(lastGeneratedUserString);
            alert("Đã sao chép tài khoản thành viên!");
        }
    </script>
</body>
</html>
